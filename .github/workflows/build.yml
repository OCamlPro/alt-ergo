name: Build

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
    branches:
      - next
      - main

# Restrict the GITHUB_TOKEN
permissions: {}

env:
  OCAML_DEFAULT_VERSION: "4.14"
  # Add OPAMYES=true to the environment, this is usefill to replace `-y` option
  # in any opam call
  OPAMYES: true
  # Alt-Ergo's depext crashs with with-test flag to yes
  #   # The with-test flag is set to true to force installation of deps and
  #   # depext needed to run the alt-ergo tests
  #   OPAMWITHTEST: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "4.14"
          - "5.5"
        include:
          # Can't run on ubuntu-latest, see
          # https://github.com/ocaml/ocaml/issues/14031
          - os: ubuntu-24.04
            ocaml-compiler: "4.13.1"
          - os: macos-latest
            ocaml-compiler: "4.14"
          - os: windows-latest
            ocaml-compiler: "4.14"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        run: opam exec -- make test-deps

      - name: Build alt-ergo with opam
        run: opam exec -- opam reinstall .

      - name: Run tests
        run: opam exec -- make runtest-ci
