name: Build statically linked binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - next
      - main

jobs:
  build-macos-static:
    name: Build statically linked macOS binaries
    # Only do this when explicitly requested since it takes a long time to
    # build on macOS; no need to waste resources
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-12
          - arch: aarch64
            os: macos-14

    permissions:
      contents: write

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Retrieve annotated tags (https://github.com/actions/checkout/issues/290)
        run: git fetch --tags --force

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
          dune-cache: true

      - name: Update opam repository
        run: opam update

      - run: opam install . --locked --deps-only --ignore-constraints-on alt-ergo-lib,alt-ergo-parsers

      - run: opam exec -- dune subst

      - run: opam exec -- dune build --release @install --promote-install-files false
        env:
          LINK_MODE: mixed

      - run: opam exec -- dune install -p alt-ergo --create-install-files --prefix opt/alt-ergo --relocatable

      - uses: actions/upload-artifact@v4
        with:
          name: alt-ergo-${{ matrix.arch }}-macos
          path: _destdir/opt/alt-ergo/bin/alt-ergo

      - name: Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          asset_name: alt-ergo-$tag-${{ matrix.arch }}-macos
          file: _destdir/opt/alt-ergo/bin/alt-ergo

  build-nix:
    name: Build relocatable binaries with nix

    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          # cache-nix-action collects garbage before creating a cache, make
          # sure the output of our build keep their dependencies alive
          extra_nix_config: |
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('default.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - name: Retrieve annotated tags (https://github.com/actions/checkout/issues/290)
        run: git fetch --tags --force

      - name: Substitute version and commit
        run: $(nix-build ./nix -A dune_3 --no-out-link)/bin/dune subst

      - name: Build static and mixed binaries
        run: |
          for mode in static mixed; do
            nix-instantiate -A alt-ergo --argstr linkMode $mode \
              --arg useFlambda true --add-root drv-$mode
            nix-build drv-$mode -o alt-ergo-$mode
          done

      - name: Test binaries
        run: |
          echo 'goal g: forall x:int. x + 1 > x' > test.ae
          alt-ergo-static/bin/alt-ergo test.ae | grep Valid
          alt-ergo-mixed/bin/alt-ergo test.ae | grep Valid
          alt-ergo-mixed/bin/alt-ergo --inequalities-plugin fm-simplex test.ae \
            | grep Valid

      - uses: actions/upload-artifact@v7
        with:
          name: alt-ergo-x86_64-linux-static
          path: alt-ergo-static/

      - uses: actions/upload-artifact@v7
        with:
          name: alt-ergo-x86_64-linux-mixed
          path: alt-ergo-mixed/
